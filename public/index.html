<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rede Inteligente</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Tahoma,sans-serif;background:linear-gradient(135deg,#eef3f8,#d9e4f0);color:#263238;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:min(720px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 15px 45px #0002}h1{margin:0 0 8px;color:#17324d}p{color:#607080;line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:24px 0}.item{background:#f6f8fa;border:1px solid #e1e7ec;border-radius:12px;padding:16px}.label{font-size:12px;text-transform:uppercase;font-weight:700;color:#66717c;margin-bottom:7px}.value{font-family:monospace;font-size:16px;word-break:break-word}.consent{display:flex;gap:10px;align-items:flex-start;background:#f5f8fb;border:1px solid #dce5ed;padding:14px;border-radius:12px;font-size:14px}.consent input{margin-top:3px}.button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#1f6feb;color:white;font-size:16px;font-weight:700;cursor:pointer}.button:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:14px;padding:12px;border-radius:10px;text-align:center;font-weight:600;display:none}.ok{display:block;background:#dff5e5;color:#176b32}.err{display:block;background:#fde3e3;color:#9b1c1c}@media(max-width:600px){.grid{grid-template-columns:1fr}.card{padding:22px}}
</style>
</head>
<body>
<main class="card">
<h1>Rede Inteligente</h1>
<p>Esta página mostra algumas informações técnicas do seu dispositivo. Você pode revisar os dados antes de enviá-los.</p>

<div class="grid">
<div class="item"><div class="label">Endereço IP público</div><div class="value" id="ip">Detectando...</div></div>
<div class="item"><div class="label">Fuso horário</div><div class="value" id="timezone">--</div></div>
<div class="item"><div class="label">Resolução da tela</div><div class="value" id="resolution">--</div></div>
<div class="item"><div class="label">Sistema operacional</div><div class="value" id="os">--</div></div>
</div>

<label class="consent">
<input type="checkbox" id="consent">
<span>Aceito o uso de cookies neste site para melhorar minha experiência e permitir o funcionamento de recursos essenciais.</span>
</label>

<button class="button" id="send" disabled>Enviar meus dados</button>
<div id="status" class="status"></div>
</main>

<script>
const $ = id => document.getElementById(id);

function getOS(){
  const ua=navigator.userAgent;
  if(ua.includes("Windows")) return "Windows";
  if(ua.includes("Android")) return "Android";
  if(ua.includes("iPhone")||ua.includes("iPad")) return "iOS";
  if(ua.includes("Mac")) return "macOS";
  if(ua.includes("Linux")) return "Linux";
  return "Desconhecido";
}

$("timezone").textContent=Intl.DateTimeFormat().resolvedOptions().timeZone||"Desconhecido";
$("resolution").textContent=`${screen.width}x${screen.height}`;
$("os").textContent=getOS();

fetch("/api/ip")
  .then(r=>r.json())
  .then(d=>{$("ip").textContent=d.ip||"Indisponível"})
  .catch(()=>{$("ip").textContent="Indisponível"});

$("consent").addEventListener("change",()=>{$("send").disabled=!$("consent").checked});

$("send").addEventListener("click",async()=>{
  $("send").disabled=true;
  const payload={
    ip:$("ip").textContent,
    timezone:$("timezone").textContent,
    resolution:$("resolution").textContent,
    os:$("os").textContent,
    userAgent:navigator.userAgent,
    language:navigator.language,
    screen:`${screen.width}x${screen.height}`,
    timestamp:new Date().toISOString()
  };
  try{
    const r=await fetch("/api/records",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok) throw new Error();
    $("status").textContent="Dados enviados com sucesso.";
    $("status").className="status ok";
  }catch(e){
    $("status").textContent="Não foi possível enviar os dados. Tente novamente.";
    $("status").className="status err";
    $("send").disabled=false;
  }
});
</script>
</body>
</html>
